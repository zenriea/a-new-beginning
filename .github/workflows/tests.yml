name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      QD_MARKET_DATA: synthetic
      QD_LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q quantdesk tests
      - name: Run tests (including Linux sandbox isolation)
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check UI display-model syntax
        run: node --check web/ui-model.mjs

  browser:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      QD_MARKET_DATA: synthetic
      QD_LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.65.2
          python -m playwright install --with-deps chromium
      # The browser tests skip when Playwright is missing; -rs plus this guard makes a skip fail the job.
      - name: Run browser tests
        run: |
          python -m pytest -q -rs tests/test_browser_*.py | tee browser.log
          ! grep -q "SKIPPED" browser.log
